<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hayden Holmes Portfolio</title>
    <link rel="icon" href="images/logo.png" type="image/x-icon">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/particles.css">
</head>
<body>
    <style>
        body {
            background: #111;
        }
        table {
            border-collapse: collapse;
            width: 100%;
        }

        th, td {
            border: 1px solid;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #0360C5;
        }

        td {
            text-align: center;
        }
        td img {
            max-width: 150px;
            max-height: 200px;
        }
    </style>
    <canvas id="particleCanvas"></canvas>
    <div class="container">
        <div class="sections__container">
            <section class="page__section">
                <h1 class="page__title">/hayden/wishlist</h1>
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Use</th>
                            <th>Picture</th>
                            <th>Link</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td class="table__name">PC Case</td>
                            <td class="table__use">Home server</td>
                            <td class="table__picture">
                                <img src="/images/compapps/images/fractal.jpg" alt="picture">
                            </td>
                            <td class="table__link">
                                <a href="https://www.amazon.com/Fractal-Design-FD-C-MES2X-02-Flexible-Tempered/dp/B08232YMV9?sr=8-1"
                                target="blank">Amazon</a></td>
                        </tr>
                        <tr>
                            <td class="table__name">PC Monitor</td>
                            <td class="table__use">For video games</td>
                            <td class="table__picture">
                                <img src="/images/compapps/images/monitor.jpg" alt="picture">
                            </td>
                            <td class="table__link">
                                <a href="https://www.amazon.com/msi-MAG-274QP-QD-OLED-X24/dp/B0G4P697M8?sr=8-3"
                                   target="blank">Amazon</a></td>
                        </tr>
                        <tr>
                            <td class="table__name">Harddrive Bay kit</td>
                            <td class="table__use">Home server</td>
                            <td class="table__picture">
                                <img src="/images/compapps/images/harddrivekit.jpg" alt="picture">
                            </td>
                            <td class="table__link">
                                <a href="https://www.bhphotovideo.com/c/product/1692533-REG/fractal_design_fd_a_tray_001_hdd_tray_kit.html"
                                   target="blank">B&H PhotoVideo</a></td>
                        </tr>
                        <tr>
                            <td class="table__name">16TB Harddrive</td>
                            <td class="table__use">Home server storage</td>
                            <td class="table__picture">
                                <img src="/images/compapps/images/harddrive.webp" alt="picture">
                            </td>
                            <td class="table__link">
                                <a href="https://serverpartdeals.com/products/seagate-exos-x18-st16000nm000j-16tb-7-2k-rpm-sata-6gb-s-3-5-refurbished-hdd?variant=39511981752362"
                                   target="blank">ServerPartDeals</a></td>
                        </tr>
                    </tbody>
                </table>
            </section>
        </div>
    </div>
    <script src="scripts/particles.js"></script>
</body>
</html>
